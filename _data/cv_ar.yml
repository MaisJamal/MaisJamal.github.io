        - أشجار السلوك، التعلم المعزز
        - تخطيط المسار، تحسين المسارات، البحث الاستدلالي
    - title: هندسة البرمجيات
      items:
        - Git، GitHub، التحكم بالإصدارات، تصحيح الأخطاء

- title: الاهتمامات الأكاديمية
  type: nested_list
  contents:
