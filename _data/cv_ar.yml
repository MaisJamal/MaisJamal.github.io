- title: التعليم
  type: time_table
  contents:
    - title: دكتوراه في الذكاء الاصطناعي وتعلّم الآلة
      institution: معهد موسكو للفيزياء والتكنولوجيا (MIPT)، موسكو، روسيا
      year: 2020 - 2024
      description:
        - "الأطروحة: تطوير وبحث خوارزميات وأساليب التخطيط التكيّفي لمناورات السيارة ذاتية القيادة."
        - التخصص في تخطيط السلوك، تخطيط المهام والحركة، والتنبؤ بمسارات العوائق المتحركة (السيارات المحيطة).
    - title: ماجستير في أنظمة الميكاترونيكس والروبوتات
      institution: جامعة باومان موسكو التقنية الحكومية، موسكو، روسيا
      year: 2018 - 2020
      description:
        - "الرسالة: تحكم بالمناورة وإمساك الأجسام باستخدام الشبكات العصبية الالتفافية للذراع الروبوتية ABB YuMi ذات 7 درجات حرية (ROS، MoveIt، Gazebo)."
    - title: بكالوريوس في هندسة الميكاترونيكس والروبوتات والأتمتة
      institution: جامعة تشرين، اللاذقية، سوريا
      year: 2012 - 2017
      description:
        - مرتبة الشرف، برنامج المتميزين.

- title: الخبرة
  type: time_table
  contents:
    - title: مهندسة تخطيط السلوك للأنظمة المستقلة
      institution: Integrant, Inc.، موسكو، روسيا
      year: 2022 - 2026
      description:
        - تطوير ونشر خوارزميات اتخاذ القرار الجاهزة للإنتاج في حزمة Apollo؛ التحقق على مركبة Kia Soul ذاتية القيادة عبر أكثر من 50 سيناريو (حضري، طرق سريعة، تقاطعات) مع تحسين الأداء بنسبة 10%.
        - تصميم خوارزمية تخطيط وجدولة استدلالية لروبوت تنظيف خارجي ذاتي القيادة؛ التطوير والتحقق في CoppeliaSim مع محرك Bullet الفيزيائي.
        - بناء وصيانة جسر ثنائي الاتجاه بين CARLA وApollo لتبادل بيانات الحساسات والتحكم، مما يتيح سير عمل من المحاكاة إلى النشر.
        - تصميم وتحسين خوارزميات توليد المسارات باستخدام إطار فرينيه لمسارات سلسة وخالية من التصادم في بيئات ديناميكية.
        - التعاون مع فرق الإدراك والتحكم لدمج خوارزميات التخطيط مع أنظمة الحساسات والتشغيل.
    - title: مساعدة باحثة - مرشحة دكتوراه
      institution: مركز النمذجة المعرفية، معهد موسكو للفيزياء والتكنولوجيا
      year: 2020 - 2024
      description:
        - تطوير إطار تخطيط المهام والحركة (FFStreams) يجمع بين البحث الاستدلالي وStreams لاتخاذ القرارات التكيّفية في الزمن الحقيقي ضمن قيود السلامة.
        - توسيع الإطار بنموذج QCNet المحوّلي للتنبؤ بمسارات الوكلاء المتعددين، مما يتيح تخطيط السلوك الواعي بالتنبؤات.
        - تقييم خوارزميات التخطيط عبر مجموعات بيانات مرجعية متعددة (inD، Argoverse 2، CitySim، INTERACTION، CommonRoad).
        - تصميم خوارزميات أشجار السلوك القائمة على التعلّم للتجاوز والركن التكيّفي بالتعلم المعزز(RL).
        - النشر في IEEE Robotics and Automation Letters (Q1) ومؤتمرات Springer LNCS.

